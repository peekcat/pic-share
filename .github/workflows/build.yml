name: build

# 推 tag（v 开头）或在 Actions 页面手动触发时，
# 同时构建 macOS arm64 / macOS x64 / Windows x64 / Linux x64 产物。
# 推 tag 时还会自动创建 GitHub Release 并附上四个平台的安装包/压缩包。
on:
  push:
    tags: ["v*"]
    branches: ["dev"]   # 推 dev 只构建四平台验证、不发布（release 作业仅在 tag 时跑）
  workflow_dispatch:

jobs:
  # 先跑测试，挂了就不必浪费四个构建 runner，更不该发版。
  # 单平台足够：测试只碰纯 Python 逻辑 + Pillow，import 链里没有 pywebview，
  # 因此不需要 GTK/WebKit 之类的系统依赖。
  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run tests
        run: python -m unittest discover -s tests -v

  build:
    name: ${{ matrix.name }}
    needs: test          # 测试不过就不打包
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14          # Apple Silicon 运行器 → arm64
            name: macos-arm64
            arch: arm64
            artifact: PicShare-macos-arm64
          - os: macos-15-intel    # Intel 运行器 → x86_64（macos-13 已于 2025-12 退役）
            name: macos-x64
            arch: x64
            artifact: PicShare-macos-x64
          - os: windows-latest    # x86_64 运行器
            name: windows-x64
            arch: x64
            artifact: PicShare-windows-x64
          - os: ubuntu-22.04      # x86_64；用较旧版本以兼容更多发行版的 glibc
            name: linux-x64
            arch: x64
            artifact: PicShare-linux-x64

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Linux 下打包 tkinter/customtkinter 需要系统 Tcl/Tk 库
      - name: Install Tcl/Tk (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk tk-dev

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install "pyinstaller>=6.0"

      # 版本号唯一真源在 src/picshare/__init__.py，产物文件名统一从这里取
      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(python -c 'import picshare; print(picshare.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Build
        run: pyinstaller picshare.spec --noconfirm --clean

      # macOS：ad-hoc 签名 + 拖拽安装的 DMG
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: bash packaging/macos/make-dmg.sh "${{ steps.ver.outputs.version }}" "${{ matrix.arch }}"

      # Windows：Inno Setup 安装包（开始菜单快捷方式 + 卸载程序，装到 %LocalAppData%，不需要管理员权限）
      - name: Package (Windows)
        shell: pwsh
        if: runner.os == 'Windows'
        run: .\packaging\windows\make-installer.ps1 -Version "${{ steps.ver.outputs.version }}"

      # Linux 暂不做安装器，仍是解压即用的 tar.gz
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "dist/PicShare-${{ steps.ver.outputs.version }}-linux-x64.tar.gz" -C dist PicShare

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/PicShare-*.dmg
            dist/PicShare-*.exe
            dist/PicShare-*.tar.gz
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    # 仅在推 tag 时发布；手动触发（无 tag）只构建不发布
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
